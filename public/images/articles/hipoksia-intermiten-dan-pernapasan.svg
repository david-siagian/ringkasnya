      <stop offset="0%" stop-color="#041418"/>
      <stop offset="55%" stop-color="#062c30"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="glow-breath" cx="120" cy="116" r="88" gradientUnits="userSpaceOnUse">
