  <circle cx="96" cy="136" r="5" fill="#34d399" fill-opacity="0.35" stroke="#6ee7b7" stroke-width="2"/>
  <circle cx="156" cy="122" r="7" fill="#2dd4bf" fill-opacity="0.3" stroke="#5eead4" stroke-width="2"/>
  <circle cx="144" cy="136" r="5" fill="#fbbf24" fill-opacity="0.35" stroke="#fcd34d" stroke-width="2"/>

