<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="bg-mvp" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0a06"/>
      <stop offset="55%" stop-color="#361808"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <radialGradient id="glow-mvp" cx="120" cy="120" r="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0f0a06" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-mvp)"/>
  <circle cx="120" cy="120" r="88" fill="url(#glow-mvp)"/>

  <!-- Sisi Kiri: Kubus MVP Ramping & Lincah -->
  <g transform="translate(36, 74)">
    <rect x="0" y="20" width="54" height="54" rx="12" fill="#1c1108" stroke="#fbbf24" stroke-width="2.5"/>
    <path d="M16 48 L24 56 L39 39" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Panah Siklus Iterasi -->
    <path d="M10 10 C22 0 38 0 48 10" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <path d="M44 6 L49 11 L43 13" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Panah Penghubung / Keseimbangan -->
  <path d="M98 121 H134" stroke="#fdba74" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <circle cx="116" cy="121" r="6" fill="#431407" stroke="#fb923c" stroke-width="2"/>

  <!-- Sisi Kanan: Menara Kompleksitas / Berlian Kesempurnaan -->
  <g transform="translate(142, 46)">
    <polygon points="32,8 58,34 48,74 16,74 6,34" fill="#1c1108" stroke="#fb923c" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M6 34 H58 M32 8 L22 34 L32 74 M32 8 L42 34 L32 74" stroke="#fdba74" stroke-opacity="0.55" stroke-width="1.6"/>
    <!-- Pijar di Puncak -->
    <circle cx="32" cy="8" r="4" fill="#fde68a"/>
  </g>

  <!-- Fondasi Timbangan di Bawah -->
  <path d="M44 182 H196" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M120 182 V198 M100 198 H140" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="64" cy="182" r="4" fill="#34d399"/>
  <circle cx="174" cy="182" r="4" fill="#fb923c"/>
</svg>
