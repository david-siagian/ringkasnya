<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="bg-bk" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="beam-bk" x1="120" y1="56" x2="120" y2="186" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="24" fill="url(#bg-bk)"/>
  <!-- Fakta beragam di luar ruang sorot (diabaikan) -->
  <polygon points="48,72 60,94 36,94" fill="#64748b" fill-opacity="0.5"/>
  <rect x="176" y="64" width="18" height="18" rx="4" fill="#64748b" fill-opacity="0.5"/>
  <polygon points="190,152 204,174 176,174" fill="#64748b" fill-opacity="0.45"/>
  <rect x="38" y="154" width="18" height="18" rx="4" fill="#64748b" fill-opacity="0.45"/>
  <!-- Lensa/ruang gema yang hanya menyaring lingkaran -->
  <circle cx="114" cy="112" r="56" fill="url(#beam-bk)" stroke="#a5b4fc" stroke-width="4"/>
  <!-- Gagang kaca pembesar -->
  <path d="M155 153 L192 190" stroke="#a5b4fc" stroke-width="9" stroke-linecap="round"/>
  <!-- Hanya simbol yang cocok (lingkaran hijau) yang disorot di dalam lensa -->
  <circle cx="96" cy="100" r="11" fill="#34d399"/>
  <circle cx="132" cy="106" r="9" fill="#34d399" fill-opacity="0.85"/>
  <circle cx="112" cy="132" r="13" fill="#6ee7b7"/>
