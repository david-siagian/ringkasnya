      <stop offset="0%" stop-color="#051410"/>
      <stop offset="55%" stop-color="#063729"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <radialGradient id="glow-uang" cx="120" cy="120" r="88" gradientUnits="userSpaceOnUse">
