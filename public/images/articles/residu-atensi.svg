<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="bg-residu" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090717"/>
      <stop offset="55%" stop-color="#1e133b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <radialGradient id="glow-residu" cx="120" cy="120" r="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#090717" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="24" fill="url(#bg-residu)"/>
  <circle cx="120" cy="120" r="88" fill="url(#glow-residu)"/>

  <!-- Lingkaran Fokus Utama (Kanan) -->
  <circle cx="152" cy="116" r="44" fill="#130b29" stroke="#c084fc" stroke-width="2.5"/>
  <circle cx="152" cy="116" r="24" stroke="#a855f7" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="152" cy="116" r="8" fill="#e9d5ff"/>

  <!-- Bayangan Tugas Lama yang Tertinggal (Kiri) -->
  <circle cx="76" cy="116" r="32" fill="#1e133b" fill-opacity="0.7" stroke="#f43f5e" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="76" cy="116" r="10" fill="#fb7185" fill-opacity="0.45"/>

  <!-- Benang Residu yang Menarik Perhatian ke Belakang -->
  <path
    d="M86 112 C104 94 124 96 144 112"
    stroke="#fb7185"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <path
    d="M86 122 C104 140 124 138 144 122"
    stroke="#c084fc"
    stroke-opacity="0.65"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Percikan Gangguan Notifikasi -->
  <g transform="translate(54, 42)">
    <rect x="0" y="0" width="38" height="24" rx="8" fill="#1f1135" stroke="#fb7185" stroke-width="2"/>
    <circle cx="12" cy="12" r="2.5" fill="#fb7185"/>
    <path d="M19 12 H30" stroke="#fda4af" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Indikator Blok Waktu Fokus di Bawah -->
  <rect x="44" y="180" width="152" height="12" rx="6" fill="#130b29" stroke="#7e22ce" stroke-width="1.8"/>
  <rect x="48" y="183" width="96" height="6" rx="3" fill="#c084fc"/>
  <rect x="148" y="183" width="22" height="6" rx="3" fill="#fb7185" fill-opacity="0.75"/>
</svg>
