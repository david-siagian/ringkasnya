name: CI & D1 Migrations

on:
  push:
    branches:
      - dev
      - main

jobs:
  verify-and-migrate:
    name: Typecheck, Build & Migrate D1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Build Project
        run: npm run build

      # Jalankan migrasi D1 untuk branch dev (preview database)
      - name: Apply D1 Migrations (Preview)
        if: github.ref == 'refs/heads/dev'
        run: npx wrangler d1 migrations apply ringkasnya-db --remote --preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TOKEN_CLOUDFLARE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID_CLOUDFLARE }}

      # Jalankan migrasi D1 untuk branch main (production database)
      - name: Apply D1 Migrations (Production)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler d1 migrations apply ringkasnya-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TOKEN_CLOUDFLARE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID_CLOUDFLARE }}
